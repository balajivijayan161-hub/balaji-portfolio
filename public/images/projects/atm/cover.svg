<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="atmTitle atmDesc">
  <title id="atmTitle">Illustration of an ATM cash-monitoring concept</title>
  <desc id="atmDesc">Line illustration of an ATM connected to role access, cash forecasting, and an activity log. This is not a screenshot of the application.</desc>
