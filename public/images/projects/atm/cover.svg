    <path d="M146 354h68M158 354v30M204 354v30" stroke="#5ee7ff" stroke-width="2"/>
    <text x="180" y="438" text-anchor="middle" fill="#9fb3c8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">ATM</text>
